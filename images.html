  <div id="imageModal" class="modal" aria-hidden="true">
    <span class="close" aria-label="Close image viewer">&times;</span>
    <span class="modal-arrow left" aria-label="Previous image">&#10094;</span>
    <img class="modal-content" id="modalImg" alt="Full-size preview">
    <span class="modal-arrow right" aria-label="Next image">&#10095;</span>
  </div>

  <script>
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const closeBtn = document.querySelector('.close');
    const leftArrow = document.querySelector('.modal-arrow.left');
    const rightArrow = document.querySelector('.modal-arrow.right');
    const images = Array.from(document.querySelectorAll('.image-gallery img'));
    let currentIndex = 0;

    function showModal(index) {
      currentIndex = index;
      modal.style.display = 'block';
      modal.setAttribute('aria-hidden', 'false');
      modalImg.src = images[index].src;
      modalImg.alt = images[index].alt;
    }

    images.forEach((img, idx) => {
      img.addEventListener('click', () => showModal(idx));
    });

    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
      modalImg.src = '';
    });

    leftArrow.addEventListener('click', (event) => {
      event.stopPropagation();
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showModal(currentIndex);
    });

    rightArrow.addEventListener('click', (event) => {
      event.stopPropagation();
      currentIndex = (currentIndex + 1) % images.length;
      showModal(currentIndex);
    });

    window.addEventListener('click', (event) => {
      if (event.target === modal) {
        modal.style.display = 'none';
        modal.setAttribute('aria-hidden', 'true');
        modalImg.src = '';
      }
    });

    window.addEventListener('keydown', (event) => {
      if (modal.style.display !== 'block') {
        return;
      }

      if (event.key === 'ArrowLeft') {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showModal(currentIndex);
      } else if (event.key === 'ArrowRight') {
        currentIndex = (currentIndex + 1) % images.length;
        showModal(currentIndex);
      } else if (event.key === 'Escape') {
        modal.style.display = 'none';
        modal.setAttribute('aria-hidden', 'true');
        modalImg.src = '';
      }
    });
  </script>

  <style>
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(2, 13, 26, 0.82);
      backdrop-filter: blur(3px);
    }

    .modal-content {
      display: block;
      margin: 7vh auto 0;
      max-width: min(90vw, 1100px);
      max-height: 78vh;
      width: auto;
      height: auto;
      border-radius: 18px;
      border: 2px solid coral;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      background: rgba(255, 255, 255, 0.04);
    }

    .close {
      position: absolute;
      top: 28px;
      right: 36px;
      color: coral;
      font-size: 3rem;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .close:hover,
    .modal-arrow:hover {
      color: #fff;
    }

    .modal-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: coral;
      font-size: clamp(2.5rem, 5vw, 4rem);
      cursor: pointer;
      user-select: none;
      padding: 0 14px;
    }

    .modal-arrow.left {
      left: 24px;
    }

    .modal-arrow.right {
      right: 24px;
    }

    @media (max-width: 700px) {
      .gallery-layout {
        grid-template-rows: 1fr;
      }

    }

    @media (max-width: 500px) {
      .close {
        top: 16px;
        right: 18px;
      }

      .modal-arrow.left {
        left: 8px;
      }

      .modal-arrow.right {
        right: 8px;
      }
    }
