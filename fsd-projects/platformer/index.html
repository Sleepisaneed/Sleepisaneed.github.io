<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brice's box runer</title>
  <link href="platformer.css" rel="stylesheet" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <script src="https://code.jquery.com/jquery-3.1.0.js"></script>
  <script src="setup.js"></script>
  <script src="helpers.js"></script>
  <script src="platformer.js"></script>
</head>

<body id="body">
  <main class="game-shell">
    <header class="game-header">
      <div>
        <p class="eyebrow">Operation Spark arcade</p>
        <h1>Brice's box runer</h1>
      </div>
      <p class="controls"><kbd>A</kbd><kbd>D</kbd> move <span aria-hidden="true">•</span> <kbd>W</kbd> /
        <kbd>Space</kbd> jump</p>
    </header>
    <div class="canvas-frame">
      <canvas id="canvas" width="1400" height="750" aria-label="Halle's Sky Run platformer"></canvas>
    </div>
    <footer class="game-footer">
      <span>Collect every signal</span>
      <span class="footer-dot" aria-hidden="true"></span>
      <span>Watch for incoming fire</span>
    </footer>
  </main>
  <img id="cannon" src="images/cannon.png" alt="" />
  <img id="player" src="images/halle.png" alt="" />
  <img id="projectile" src="images/projectile.png" alt="" />
</body>

</html>
