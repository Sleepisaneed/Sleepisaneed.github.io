<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Brice Maggio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="space-background.js" defer></script>
  <script src="gallery-background.js" defer></script>
  <script src="gallery-quote.js" defer></script>
</head>

<body>
  <div id="all-contents">
    <nav>
      <h1>Brice's Website</h1>
      <ul id="nav-ul">
        <li class="nav-li"><a href="index.html">Home</a></li>
        <li class="nav-li"><a href="portfolio.html">Portfolio</a></li>
        <li class="nav-li"><a href="third-page.html">Gallery</a></li>
        <li class="nav-li"><a href="schedule.html">Schedule</a></li>
      </ul>
    </nav>

    <main class="gallery-layout">
      <section class="gallery-intro">
        <h1>Sleep Mode</h1>
        <p>A small gallery of places and moments that make slowing down feel worthwhile.</p>
        <div class="image-gallery">
          <figure>
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80"
              alt="Mountain valley beside a calm lake">
            <figcaption>Quiet places</figcaption>
          </figure>
          <figure>
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80"
              alt="Sunlight shining through a forest">
            <figcaption>Slow mornings</figcaption>
          </figure>
          <figure>
            <img src="https://images.unsplash.com/photo-1502134249126-9f3755a50d78?auto=format&fit=crop&w=900&q=80"
              alt="A star filled night sky over a dark landscape">
            <figcaption>Starry skies</figcaption>
          </figure>
          <figure>
            <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80"
              alt="A calm coastline with layered cliffs and water">
            <figcaption>Coastal calm</figcaption>
          </figure>
          <figure>
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
              alt="A quiet mountainous road at sunset">
            <figcaption>Golden roads</figcaption>
          </figure>
          <figure>
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80"
              alt="A lush forest with sunlight shining through the trees">
            <figcaption>Forest glow</figcaption>
          </figure>
        </div>
      </section>

      <aside class="gallery-side-panel">
        <div class="daily-quote" aria-live="polite">
          <p class="quote-date" id="quote-date"></p>
          <blockquote>
            <p id="daily-quote-text">“Be still, and know that I am God.”</p>
            <footer id="daily-quote-reference">Psalm 46:10</footer>
          </blockquote>
        </div>

        <button id="gallery-reset-btn" type="button" class="gallery-reset-btn">Reset background</button>
      </aside>
    </main>
  </div>
</body>

</html>
